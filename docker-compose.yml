services:
  db:
    image: postgres:16
    container_name: micro-cms-db
    environment:
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: cms_password
      POSTGRES_DB: micro_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d micro_cms"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: micro-cms-api
    environment:
      DATABASE_URL: postgresql://cms_user:cms_password@db:5432/micro_cms
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - cms-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: micro-cms-web
    ports:
      - "5173:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - cms-network

volumes:
  postgres_data:

networks:
  cms-network:
    driver: bridge
